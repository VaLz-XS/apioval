<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oval Music - Spotify Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000000; 
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
        }

        .text-spotify { color: #1DB954; }
        .bg-spotify { background-color: #1DB954; }
        .bg-base { background-color: #121212; }
        .bg-highlight { background-color: #1A1A1A; }
        .bg-hover:hover { background-color: #2A2A2A; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #535353; border-radius: 10px; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin 15s linear infinite; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #fff; cursor: pointer; margin-top: -4px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #535353; border-radius: 2px; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #nowPlayingView { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); transform: translateY(100%); }
        #nowPlayingView.active { transform: translateY(0); }
    </style>
</head>
<body>

    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- SIDEBAR (Desktop) -->
        <aside class="hidden md:flex flex-col w-64 bg-black p-2 gap-2 z-10">
            <div class="bg-base rounded-lg p-4 flex items-center gap-2">
                <svg class="w-8 h-8 text-spotify" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.6 14.3c-.2.3-.6.4-.9.2-2.5-1.5-5.6-1.9-9.3-1-.4.1-.7-.1-.8-.5-.1-.4.1-.7.5-.8 4-.9 7.5-.5 10.3 1.2.3.2.4.6.2.9zm1.2-2.7c-.2.4-.7.5-1.1.3-2.8-1.7-7.1-2.2-10.4-1.2-.4.1-.9-.1-1-.5-.1-.4.1-.9.5-1 3.8-1.1 8.5-.6 11.7 1.4.4.2.5.7.3 1zm.1-2.8C14.5 8.9 8.6 8.7 5.1 9.8c-.5.2-1-.1-1.2-.6-.2-.5.1-1 .6-1.2 4-1.2 10.4-1 14.4 1.4.5.3.6.9.3 1.3-.3.5-.9.6-1.4.3z"/></svg>
                <h1 class="text-xl font-bold tracking-tight">Oval Music</h1>
            </div>
            
            <div class="bg-base rounded-lg p-4 flex flex-col gap-4">
                <button onclick="switchTab('home')" class="flex items-center gap-4 text-gray-300 hover:text-white transition group font-bold">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Beranda
                </button>
                <button onclick="switchTab('search')" class="flex items-center gap-4 text-gray-300 hover:text-white transition group font-bold">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg> Cari
                </button>
                <button onclick="switchTab('library')" class="flex items-center gap-4 text-gray-300 hover:text-white transition group font-bold">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 5h-3v5.5c0 1.38-1.12 2.5-2.5 2.5S10 13.88 10 12.5s1.12-2.5 2.5-2.5c.57 0 1.08.19 1.5.51V5h4v2zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6z"/></svg> Library
                </button>
            </div>

            <div class="bg-base rounded-lg p-4 flex-1 overflow-y-auto no-scrollbar">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-gray-400 font-bold text-sm">PLAYLIST LU</h2>
                    <button onclick="clearPlaylist()" class="text-xs text-gray-400 hover:text-white">Hapus</button>
                </div>
                <div id="sidebarPlaylist" class="flex flex-col gap-3"></div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 bg-base md:m-2 md:rounded-lg overflow-y-auto relative pb-32">
            <header class="sticky top-0 bg-base/90 backdrop-blur-md z-30 flex justify-between items-center p-4">
                <div class="flex items-center gap-2 md:hidden">
                    <svg class="w-8 h-8 text-spotify" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.6 14.3c-.2.3-.6.4-.9.2-2.5-1.5-5.6-1.9-9.3-1-.4.1-.7-.1-.8-.5-.1-.4.1-.7.5-.8 4-.9 7.5-.5 10.3 1.2.3.2.4.6.2.9zm1.2-2.7c-.2.4-.7.5-1.1.3-2.8-1.7-7.1-2.2-10.4-1.2-.4.1-.9-.1-1-.5-.1-.4.1-.9.5-1 3.8-1.1 8.5-.6 11.7 1.4.4.2.5.7.3 1zm.1-2.8C14.5 8.9 8.6 8.7 5.1 9.8c-.5.2-1-.1-1.2-.6-.2-.5.1-1 .6-1.2 4-1.2 10.4-1 14.4 1.4.5.3.6.9.3 1.3-.3.5-.9.6-1.4.3z"/></svg>
                    <h1 class="text-lg font-bold">Oval</h1>
                </div>
                <a href="/" class="ml-auto text-sm font-bold bg-white text-black px-4 py-1.5 rounded-full hover:scale-105 transition">Home</a>
            </header>

            <div id="tab-home" class="p-4 md:p-6">
                <h2 class="text-2xl font-bold mb-6">Selamat Datang!</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div onclick="switchTab('search')" class="bg-highlight hover:bg-hover transition rounded-md overflow-hidden cursor-pointer flex items-center h-20 group">
                        <img src="https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" class="h-full w-20 object-cover">
                        <h3 class="font-bold ml-4 group-hover:text-spotify transition">Mulai Cari Lagu</h3>
                    </div>
                </div>
            </div>

            <div id="tab-search" class="hidden p-4 md:p-6">
                <div class="relative mb-8 max-w-2xl">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </div>
                    <input type="text" id="searchInput" placeholder="Cari lagu di Spotify / YouTube..." class="w-full bg-white text-black placeholder-gray-500 rounded-full py-3 pl-12 pr-4 focus:outline-none focus:ring-2 focus:ring-white transition shadow-lg font-medium">
                </div>

                <div id="loading" class="hidden flex-col items-center justify-center py-10">
                    <svg class="animate-spin h-8 w-8 text-spotify mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <p class="text-sm text-gray-400 font-medium">Mencari...</p>
                </div>

                <div id="songList" class="flex flex-col gap-1"></div>
            </div>

            <div id="tab-library" class="hidden p-4 md:p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Playlist Lu</h2>
                    <button onclick="clearPlaylist()" class="text-sm text-gray-400 hover:text-white border border-gray-600 px-3 py-1 rounded-full">Hapus Semua</button>
                </div>
                <div id="mobileLibraryList" class="flex flex-col gap-2"></div>
            </div>
        </main>

        <!-- NOW PLAYING VIEW -->
        <div id="nowPlayingView" class="absolute inset-0 bg-[#121212] z-40 flex flex-col transform translate-y-full">
            <div class="flex items-center justify-between p-4">
                <button onclick="closeNowPlaying()" class="text-white hover:scale-110 transition">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <span class="text-xs font-bold tracking-widest text-gray-400">MEMUTAR</span>
                <div class="w-8"></div>
            </div>

            <div class="flex-1 flex flex-col md:flex-row p-6 gap-8 overflow-y-auto no-scrollbar">
                <div class="flex flex-col items-center w-full md:w-1/2 mt-4">
                    <div class="w-full max-w-[300px] aspect-square shadow-2xl mb-8 relative">
                        <img id="npThumb" class="w-full h-full object-cover rounded-md shadow-black/50 shadow-2xl" src="">
                    </div>
                    <div class="w-full max-w-[300px] flex justify-between items-start">
                        <div class="overflow-hidden">
                            <h1 id="npTitle" class="text-2xl font-black truncate">Judul Lagu</h1>
                            <p id="npAuthor" class="text-lg text-gray-400 truncate mt-1">Artis</p>
                        </div>
                    </div>
                </div>

                <div class="w-full md:w-1/2 flex flex-col h-full">
                    <div class="mt-auto md:mt-0 flex flex-col items-center w-full">
                        <div class="w-full mb-4">
                            <input type="range" id="npSeekBar" min="0" max="100" value="0" class="w-full">
                            <div class="flex justify-between text-xs text-gray-400 mt-1">
                                <span id="npCurrentTime">0:00</span>
                                <span id="npDuration">0:00</span>
                            </div>
                        </div>
                        <div class="flex items-center justify-center w-full gap-6 mb-8">
                            <button id="npPlayBtn" class="bg-white text-black p-3 rounded-full hover:scale-110 transition">
                                <svg id="npIconPlay" class="w-8 h-8 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                <svg id="npIconPause" class="w-8 h-8 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                                <svg id="npIconLoading" class="w-8 h-8 animate-spin hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            </button>
                        </div>
                    </div>

                    <div class="mt-4 w-full bg-[#181818] rounded-lg p-4 flex-1 flex flex-col max-h-[300px]">
                        <h3 class="text-sm font-bold text-gray-300 mb-4">Berikutnya di Antrean</h3>
                        <div id="queueList" class="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MINI PLAYER -->
    <div onclick="openNowPlaying()" class="fixed bottom-[60px] md:bottom-0 left-0 w-full bg-[#181818] border-t border-[#282828] px-4 py-2 flex items-center justify-between z-50 h-16 md:h-24 shrink-0 cursor-pointer hover:bg-[#282828] transition">
        <div class="flex items-center gap-3 w-3/4 md:w-1/4">
            <div class="w-10 h-10 md:w-14 md:h-14 rounded-md overflow-hidden shrink-0 bg-gray-800 relative">
                <img id="miniThumb" class="w-full h-full object-cover" src="">
            </div>
            <div class="flex flex-col overflow-hidden">
                <h3 id="miniTitle" class="font-bold text-sm text-white truncate">Belum ada lagu</h3>
                <p id="miniAuthor" class="text-xs text-gray-400 truncate">Pilih lagu dulu</p>
            </div>
        </div>
        <div class="flex items-center justify-center gap-4 w-1/4 md:w-2/4">
            <button id="miniPlayBtn" class="text-white hover:scale-110 transition transform bg-white rounded-full p-1.5" onclick="event.stopPropagation()">
                <svg id="miniIconPlay" class="w-5 h-5 hidden text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="miniIconPause" class="w-5 h-5 hidden text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                <svg id="miniIconLoading" class="w-5 h-5 animate-spin hidden text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
        </div>
        <div class="w-1/4 justify-end hidden md:flex"></div>
    </div>

    <!-- BOTTOM NAV (Mobile) -->
    <nav class="fixed bottom-0 left-0 w-full bg-black border-t border-[#282828] h-[60px] flex md:hidden z-50">
        <button onclick="switchTab('home')" class="flex-1 flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
            <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span class="text-[10px] font-bold">Beranda</span>
        </button>
        <button onclick="switchTab('search')" class="flex-1 flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
            <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span class="text-[10px] font-bold">Cari</span>
        </button>
        <button onclick="switchTab('library')" class="flex-1 flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
            <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 5h-3v5.5c0 1.38-1.12 2.5-2.5 2.5S10 13.88 10 12.5s1.12-2.5 2.5-2.5c.57 0 1.08.19 1.5.51V5h4v2zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6z"/></svg>
            <span class="text-[10px] font-bold">Library</span>
        </button>
    </nav>

    <audio id="audioPlayer"></audio>

    <script>
        const API_KEY = 'ov_382b386c1da4a353d64e9aae';
        const audio = document.getElementById('audioPlayer');
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        let currentSong = null;
        let queue = []; 
        let playlist = JSON.parse(localStorage.getItem('oval_playlist')) || [];

        function switchTab(tab) {
            document.getElementById('tab-home').classList.add('hidden');
            document.getElementById('tab-search').classList.add('hidden');
            document.getElementById('tab-library').classList.add('hidden');
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            
            if (tab === 'search') document.getElementById('searchInput').focus();
            if (tab === 'library') renderMobileLibrary();
        }

        function openNowPlaying() {
            if (!currentSong) return;
            document.getElementById('nowPlayingView').classList.add('active');
            document.getElementById('nowPlayingView').classList.remove('translate-y-full');
        }

        function closeNowPlaying() {
            document.getElementById('nowPlayingView').classList.remove('active');
            document.getElementById('nowPlayingView').classList.add('translate-y-full');
        }

        function renderPlaylist() {
            const container = document.getElementById('sidebarPlaylist');
            if(!container) return;
            container.innerHTML = '';
            if (playlist.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500">Belum ada lagu.</p>`;
                return;
            }
            playlist.forEach((song) => {
                const item = document.createElement('div');
                item.className = 'flex items-center gap-3 cursor-pointer group';
                item.innerHTML = `
                    <img src="${song.thumb}" class="w-10 h-10 rounded object-cover">
                    <div class="flex flex-col overflow-hidden">
                        <span class="text-sm font-bold text-white truncate group-hover:text-spotify">${song.title}</span>
                        <span class="text-xs text-gray-400 truncate">${song.author}</span>
                    </div>
                `;
                item.onclick = () => playSong(song, playlist);
                container.appendChild(item);
            });
        }

        function renderMobileLibrary() {
            const container = document.getElementById('mobileLibraryList');
            container.innerHTML = '';
            if (playlist.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-500">Belum ada lagu di library lu.</p>`;
                return;
            }
            playlist.forEach((song) => {
                const item = document.createElement('div');
                item.className = 'flex items-center gap-4 p-2 rounded-md hover:bg-hover transition cursor-pointer group';
                item.innerHTML = `
                    <img src="${song.thumb}" class="w-14 h-14 rounded object-cover">
                    <div class="flex flex-col overflow-hidden">
                        <span class="text-sm font-bold text-white truncate">${song.title}</span>
                        <span class="text-xs text-gray-400 truncate mt-1">${song.author}</span>
                    </div>
                `;
                item.onclick = () => playSong(song, playlist);
                container.appendChild(item);
            });
        }

        function clearPlaylist() {
            playlist = [];
            localStorage.removeItem('oval_playlist');
            renderPlaylist();
            renderMobileLibrary();
        }

        function renderQueue() {
            const container = document.getElementById('queueList');
            container.innerHTML = '';
            const currentIndex = queue.findIndex(s => s.title === currentSong.title);
            const nextSongs = queue.slice(currentIndex + 1);

            if (nextSongs.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-500">Tidak ada antrean berikutnya.</p>`;
                return;
            }

            nextSongs.forEach(song => {
                const item = document.createElement('div');
                item.className = 'flex items-center gap-3 p-2 hover:bg-[#282828] rounded-md cursor-pointer transition';
                item.innerHTML = `
                    <img src="${song.thumb}" class="w-10 h-10 rounded object-cover">
                    <div class="flex flex-col overflow-hidden">
                        <span class="text-sm font-bold text-white truncate">${song.title}</span>
                        <span class="text-xs text-gray-400 truncate">${song.author}</span>
                    </div>
                `;
                item.onclick = () => playSong(song, queue);
                container.appendChild(item);
            });
        }

        // === PENCARIAN GABUNGAN (SPOTIFY & YOUTUBE) ===
        document.getElementById('searchInput').addEventListener('input', debounce(async (e) => {
            const query = e.target.value.trim();
            if (!query) {
                document.getElementById('songList').innerHTML = '';
                return;
            }

            const loading = document.getElementById('loading');
            const songList = document.getElementById('songList');

            loading.classList.remove('hidden');
            loading.classList.add('flex');
            songList.innerHTML = '';

            let searchResults = [];

            // 1. Coba cari di Spotify dulu (via endpoint /api/spotify-search)
            try {
                const resSpotify = await fetch(`https://apioval.vercel.app/api/spotify-search?q=${encodeURIComponent(query)}`);
                const dataSpotify = await resSpotify.json();

                if (dataSpotify.ok && dataSpotify.results.length > 0) {
                    dataSpotify.results.slice(0, 5).forEach((track) => {
                        const songData = {
                            title: track.title,
                            author: track.artist,
                            thumb: track.thumbnail,
                            type: 'spotify',
                            spotifyUrl: track.url
                        };
                        searchResults.push(songData);

                        const card = document.createElement('div');
                        card.className = 'flex items-center gap-4 p-2 rounded-md hover:bg-hover transition cursor-pointer group';
                        card.innerHTML = `
                            <div class="text-spotify w-4 text-center text-sm font-bold">S</div>
                            <div class="w-12 h-12 rounded overflow-hidden shrink-0 relative">
                                <img src="${track.thumbnail}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-1 overflow-hidden">
                                <h3 class="font-bold text-sm text-white truncate">${track.title}</h3>
                                <p class="text-xs text-gray-400 mt-1 truncate">${track.artist}</p>
                            </div>
                            <div class="text-xs text-spotify px-2 font-bold">SPOTIFY</div>
                        `;

                        card.onclick = () => {
                            playSong(songData, searchResults);
                            if (!playlist.some(s => s.title === track.title)) {
                                playlist.unshift(songData);
                                if (playlist.length > 20) playlist.pop();
                                localStorage.setItem('oval_playlist', JSON.stringify(playlist));
                                renderPlaylist();
                                renderMobileLibrary();
                            }
                        };
                        songList.appendChild(card);
                    });
                }
            } catch (err) {
                console.log('Gagal cari Spotify, coba YouTube...');
            }

            // 2. Coba cari di YouTube (via CORS Proxy)
            try {
                const targetUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
                const resYt = await fetch(CORS_PROXY + encodeURIComponent(targetUrl));
                const html = await resYt.text();

                const match = html.match(/var ytInitialData = ({.*?});<\/script>/);
                if (!match) throw new Error('Gagal parsing data.');

                const ytData = JSON.parse(match[1]);
                const contents = ytData.contents.twoColumnSearchResultsRenderer
                    .primaryContents.sectionListRenderer.contents[0]
                    .itemSectionRenderer.contents;

                const ytResults = contents.filter(c => c.videoRenderer).map(c => c.videoRenderer);

                ytResults.slice(0, 5).forEach((video) => {
                    const title = video.title.runs[0].text;
                    const channel = video.ownerText.runs[0].text;
                    const duration = video.lengthText?.simpleText || '0:00';
                    const thumbnail = `https://i.ytimg.com/vi/${video.videoId}/hqdefault.jpg`;
                    
                    const songData = { title, author: channel, thumb: thumbnail, type: 'youtube' };
                    searchResults.push(songData);

                    const card = document.createElement('div');
                    card.className = 'flex items-center gap-4 p-2 rounded-md hover:bg-hover transition cursor-pointer group';
                    card.innerHTML = `
                        <div class="text-red-500 w-4 text-center text-sm font-bold">Y</div>
                        <div class="w-12 h-12 rounded overflow-hidden shrink-0 relative">
                            <img src="${thumbnail}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 overflow-hidden">
                            <h3 class="font-bold text-sm text-white truncate">${title}</h3>
                            <p class="text-xs text-gray-400 mt-1 truncate">${channel}</p>
                        </div>
                        <div class="text-xs text-gray-400 px-2">${duration}</div>
                    `;

                    card.onclick = () => {
                        playSong(songData, searchResults);
                        if (!playlist.some(s => s.title === title)) {
                            playlist.unshift(songData);
                            if (playlist.length > 20) playlist.pop();
                            localStorage.setItem('oval_playlist', JSON.stringify(playlist));
                            renderPlaylist();
                            renderMobileLibrary();
                        }
                    };
                    songList.appendChild(card);
                });

            } catch (err) {
                console.log('Gagal cari YouTube...');
            }

            loading.classList.add('hidden');
            loading.classList.remove('flex');

            if (searchResults.length === 0) {
                songList.innerHTML = `<p class="text-center text-gray-500 mt-4">Lagu tidak ditemukan.</p>`;
            }

        }, 600));

        // === PLAYER LOGIC ===
        async function playSong(song, currentQueue) {
            currentSong = song;
            queue = currentQueue || [song];

            document.getElementById('miniTitle').innerText = song.title;
            document.getElementById('miniAuthor').innerText = song.author;
            document.getElementById('miniThumb').src = song.thumb;

            document.getElementById('npTitle').innerText = song.title;
            document.getElementById('npAuthor').innerText = song.author;
            document.getElementById('npThumb').src = song.thumb;

            document.getElementById('miniIconPlay').classList.add('hidden');
            document.getElementById('miniIconPause').classList.add('hidden');
            document.getElementById('miniIconLoading').classList.remove('hidden');

            document.getElementById('npIconPlay').classList.add('hidden');
            document.getElementById('npIconPause').classList.add('hidden');
            document.getElementById('npIconLoading').classList.remove('hidden');

            try {
                if (song.type === 'spotify' && song.spotifyAudioUrl) {
                    audio.src = song.spotifyAudioUrl;
                    await audio.play();
                } else if (song.type === 'spotify' && song.spotifyUrl) {
                    // Kalau dari search, kita harus nembak /api/spotify dulu buat dapet link MP3-nya
                    const res = await fetch(`https://apioval.vercel.app/api/spotify?url=${encodeURIComponent(song.spotifyUrl)}`);
                    const data = await res.json();
                    
                    if (!data.ok) throw new Error(data.error || 'Gagal mengambil audio Spotify');
                    
                    const audioDL = data.downloads.find(d => d.type === 'audio');
                    if (!audioDL) throw new Error('Link audio tidak ditemukan.');
                    
                    song.spotifyAudioUrl = audioDL.url;
                    audio.src = audioDL.url;
                    await audio.play();
                } else {
                    // YouTube
                    const res = await fetch(`https://apioval.vercel.app/api/play?q=${encodeURIComponent(song.title)}&apikey=${API_KEY}`);
                    const data = await res.json();

                    if (!data.ok) throw new Error(data.error || 'Gagal ambil data dari API');

                    const audioUrl = data.audio || data.video || data.url;
                    if (!audioUrl) throw new Error('Link audio tidak ditemukan.');

                    audio.src = audioUrl;
                    await audio.play();
                }

                renderQueue();

            } catch (err) {
                console.error(err);
                alert('Gagal memutar: ' + err.message);
                document.getElementById('miniIconPlay').classList.remove('hidden');
                document.getElementById('miniIconLoading').classList.add('hidden');
            }
        }

        // Event Audio
        document.getElementById('miniPlayBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.paused) audio.play();
            else audio.pause();
        });

        document.getElementById('npPlayBtn').addEventListener('click', () => {
            if (audio.paused) audio.play();
            else audio.pause();
        });

        audio.addEventListener('play', () => {
            document.getElementById('miniIconPlay').classList.add('hidden');
            document.getElementById('miniIconPause').classList.remove('hidden');
            document.getElementById('miniIconLoading').classList.add('hidden');
            
            document.getElementById('npIconPlay').classList.add('hidden');
            document.getElementById('npIconPause').classList.remove('hidden');
            document.getElementById('npIconLoading').classList.add('hidden');

            document.getElementById('npThumb').classList.add('animate-spin-slow');
        });

        audio.addEventListener('pause', () => {
            document.getElementById('miniIconPlay').classList.remove('hidden');
            document.getElementById('miniIconPause').classList.add('hidden');
            
            document.getElementById('npIconPlay').classList.remove('hidden');
            document.getElementById('npIconPause').classList.add('hidden');

            document.getElementById('npThumb').classList.remove('animate-spin-slow');
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                document.getElementById('npSeekBar').value = percent;
                document.getElementById('npCurrentTime').innerText = formatTime(audio.currentTime);
                document.getElementById('npDuration').innerText = formatTime(audio.duration);
            }
        });

        document.getElementById('npSeekBar').addEventListener('input', (e) => {
            if (audio.duration) {
                audio.currentTime = (e.target.value / 100) * audio.duration;
            }
        });

        audio.addEventListener('ended', () => {
            const currentIndex = queue.findIndex(s => s.title === currentSong.title);
            const nextSong = queue[currentIndex + 1];
            if (nextSong) {
                playSong(nextSong, queue);
            }
        });

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => { clearTimeout(timeout); func(...args); };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        renderPlaylist();
        renderMobileLibrary();
    </script>
</body>
</html>
